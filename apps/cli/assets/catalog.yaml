# uwh - Katalog
#
# Jeder Eintrag beschreibt, WIE etwas installiert wird. Der Weg steht in 'provider':
#
#   winget      Paket aus der Windows-Paketquelle          id: Paketkennung
#   msstore     App aus dem Microsoft Store                id: Paketkennung
#   feature     Windows-Funktion (Systemsteuerung)         id: Funktionsname
#   capability  Optionale Windows-Komponente               id: Komponentenname
#   url         Direkter Download von einer https-Adresse  url:, args:, sha256:
#   psmodule    PowerShell-Modul                           id: Modulname
#   script      Skript neben dieser Datei                  file: name.ps1
#
# Weitere Felder:
#   name         Anzeigename im Menue (hoechstens 24 Zeichen)
#   description  Ein kurzer Satz, was es ist (hoechstens 31 Zeichen)
#   category     Muss unten in 'categories' stehen
#   scope        machine (Standard) oder user
#   admin        true/false - sonst wird es aus dem provider abgeleitet
#   reboot       required, wenn danach ein Neustart noetig ist
#   recommended  true - im Menue vorausgewaehlt
#   note         Hinweis, der vor der Ausfuehrung angezeigt wird
#
# Sprachen: Die Texte ohne Kuerzel sind Englisch und gelten fuer jede Sprache
# ohne eigene Uebersetzung. Uebersetzt wird mit angehaengtem Kuerzel DE, ES,
# IT oder FR - bei name, description, category, note, question und id:
#
#   description: Text editor
#   descriptionDE: Texteditor
#
# Eine id je Sprache braucht es nur, wo der Hersteller jede Sprache als eigenes
# Paket fuehrt (Firefox, Thunderbird). Namen von Programmen bleiben meist gleich.
#
# Fragen stehen unter 'actions' -> 'prompts' (Beispiel: Eintrag 'explorer'
# unten). type ist text, yesno oder secret. 'secret' wird nie in ein Profil
# geschrieben - bei Kennwoertern immer setzen.
#
# EIGENE PROGRAMME NICHT HIER EINTRAGEN. Diese Datei wird bei jeder
# Aktualisierung von uwh ersetzt. Eigenes gehoert nach
# data\eigene\config.yaml - oder in ein eigenes Repo, siehe config\repo.yaml.
#
# Wer an dieser Datei hier arbeitet, prueft danach (aus apps\cli\):
#   .\uwh.ps1 -Doctor                                      Aufbau
#   powershell -ExecutionPolicy Bypass -File tests\sprache.tests.ps1  alles uebersetzt, passt es?
#   powershell -ExecutionPolicy Bypass -File tests\online.tests.ps1   gibt es das Paket?
# Paketkennungen veralten - beim Aufbau waren 5 von 46 falsch.

