  # ----------------------------------------------------------------
  # Windows settings (Skripte liegen neben dieser Datei)
  # ----------------------------------------------------------------

  # Ja/Nein-Antworten heissen intern immer ja/nein, egal in welcher Sprache
  # gefragt wurde - so stehen sie auch in Profilen.
  explorer:
    name: Tidy up Explorer
    nameDE: Explorer aufräumen
    nameES: Ajustar el Explorador
    nameIT: Sistemare Esplora file
    nameFR: Ajuster l'Explorateur
    description: Shows file extensions and more
    category: Windows settings
    descriptionDE: Zeigt Dateiendungen und mehr
    categoryDE: Windows-Einstellungen
    descriptionES: Muestra extensiones y más
    categoryES: Configuración de Windows
    descriptionIT: Mostra estensioni e altro
    categoryIT: Impostazioni di Windows
    descriptionFR: Affiche les extensions et plus
    categoryFR: Paramètres Windows
    provider: script
    file: explorer.ps1
    admin: false
    actions:
      - name: install
        description: Apply settings
        descriptionDE: Einstellungen setzen
        descriptionES: Aplicar ajustes
        descriptionIT: Applica impostazioni
        descriptionFR: Appliquer les réglages
        prompts:
          - question: Always show file extensions?
            questionDE: Dateiendungen immer anzeigen?
            questionES: ¿Mostrar siempre las extensiones?
            questionIT: Mostrare sempre le estensioni dei file?
            questionFR: Toujours afficher les extensions ?
            variable: ENDUNGEN
            type: yesno
            default: ja
          - question: Show hidden files?
            questionDE: Versteckte Dateien anzeigen?
            questionES: ¿Mostrar archivos ocultos?
            questionIT: Mostrare i file nascosti?
            questionFR: Afficher les fichiers cachés ?
            variable: VERSTECKT
            type: yesno
            default: nein

  # Der Plan wird als Zahl gewaehlt - die versteht jede Sprache. Die alten
  # Antworten (ausgewogen, hoechstleistung, energiesparen) gelten weiter.
  energie:
    name: Power plan
    nameDE: Energieplan
    nameES: Plan de energía
    nameIT: Piano energetico
    nameFR: Mode d'alimentation
    description: When the PC goes to sleep
    category: Windows settings
    descriptionDE: Wann der Rechner schlafen geht
    categoryDE: Windows-Einstellungen
    descriptionES: Cuándo se suspende el equipo
    categoryES: Configuración de Windows
    descriptionIT: Quando il PC va in sospensione
    categoryIT: Impostazioni di Windows
    descriptionFR: Quand le PC se met en veille
    categoryFR: Paramètres Windows
    provider: script
    file: energie.ps1
    admin: true
    actions:
      - name: install
        description: Set power plan
        descriptionDE: Energieplan setzen
        descriptionES: Establecer el plan de energía
        descriptionIT: Imposta il piano energetico
        descriptionFR: Définir le mode d'alimentation
        prompts:
          - question: "Plan: 1 = Balanced, 2 = High performance, 3 = Power saver"
            questionDE: "Plan: 1 = Ausbalanciert, 2 = Höchstleistung, 3 = Energiesparmodus"
            questionES: "Plan: 1 = Equilibrado, 2 = Alto rendimiento, 3 = Economizador"
            questionIT: "Piano: 1 = Bilanciato, 2 = Prestazioni elevate, 3 = Risparmio di energia"
            questionFR: "Mode : 1 = Utilisation normale, 2 = Performances élevées, 3 = Économies d'énergie"
            variable: PLAN
            type: text
            default: '1'
          - question: Turn off the screen after how many minutes? (0 = never)
            questionDE: Bildschirm aus nach wie vielen Minuten? (0 = nie)
            questionES: ¿Apagar la pantalla tras cuántos minutos? (0 = nunca)
            questionIT: Spegnere lo schermo dopo quanti minuti? (0 = mai)
            questionFR: Éteindre l'écran après combien de minutes ? (0 = jamais)
            variable: BILDSCHIRM
            type: text
            default: '15'
