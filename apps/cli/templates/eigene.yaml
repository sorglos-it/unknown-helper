# Eigene Programme
#
# Hier eintragen, was im Katalog von uwh fehlt. Diese Datei fasst die
# Aktualisierung von uwh nie an - anders als den Katalog von uwh selbst.
#
# Aufbau wie im Katalog assets\catalog.yaml, steht dort oben erklaert. 'category'
# ist hier freiwillig: ohne landet der Eintrag unter "Eigene Programme".
# Gleicher Name wie ein uwh-Eintrag = deine Fassung ersetzt die von uwh.
#
# Eigene Skripte gehoeren nach data\eigene\scripts\ (Vorlage:
# templates\script-template.ps1 von uwh).
#
# Danach pruefen:  .\uwh.ps1 -Doctor
#
# Beispiel - die Raute am Zeilenanfang entfernen:
#
# scripts:
#   treesize:
#     name: TreeSize Free
#     description: Zeigt, was den Speicher belegt
#     provider: winget
#     id: JAMSoftware.TreeSize.Free
