  explorer:
    name: Explorer aufraeumen
    description: Zeigt Dateiendungen und mehr
    category: Windows-Einstellungen
    provider: script
    file: explorer.ps1
    admin: false
    actions:
      - name: install
        description: Einstellungen setzen
        prompts:
          - question: Dateiendungen immer anzeigen?
            variable: ENDUNGEN
            type: yesno
            default: ja
          - question: Versteckte Dateien anzeigen?
            variable: VERSTECKT
            type: yesno
            default: nein

  energie:
    name: Energieplan
    description: Wann der Rechner schlafen geht
    category: Windows-Einstellungen
    provider: script
    file: energie.ps1
    admin: true
    actions:
      - name: install
        description: Energieplan setzen
        prompts:
          - question: Plan (ausgewogen / hoechstleistung)
            variable: PLAN
            type: text
            default: ausgewogen
          - question: Bildschirm aus nach wie vielen Minuten? (0 = nie)
            variable: BILDSCHIRM
            type: text
            default: '15'
